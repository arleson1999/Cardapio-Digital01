<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cardápio Digital</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>Cardápio Digital</h1>
      <section class="menu-cart-layout">
        <section class="panel menu-panel">
          <div class="toolbar">
            <button id="refresh-button">Atualizar cardápio</button>
          </div>
          <div class="categories" id="categories"></div>
          <div id="menu-list"></div>
        </section>

        <section class="panel cart-panel">
          <div class="cart-header">
            <h2>Seu pedido</h2>
            <p id="cart-count">0 itens</p>
          </div>
          <div class="cart-items" id="cart-items"></div>
          <div class="cart-summary">
            <div>
              <span>Total</span>
              <strong id="cart-total">R$ 0,00</strong>
            </div>
            <button id="finalize-order-button" class="full-width">
              Finalizar pedido
            </button>
          </div>
        </section>
      </section>

      <section class="panel" id="form-panel">
        <h2>Adicionar item</h2>
        <form id="item-form">
          <label>
            Nome
            <input type="text" id="item-name" required />
          </label>
          <label>
            Categoria
            <input
              type="text"
              id="item-category"
              placeholder="Ex: Bebidas"
              required
            />
          </label>
          <label>
            Imagem (URL)
            <input
              type="url"
              id="item-image"
              placeholder="https://..."
              required
            />
          </label>
          <label>
            Descrição
            <textarea id="item-description" rows="3" required></textarea>
          </label>
          <label>
            Preço (R$)
            <input type="number" id="item-price" min="0" step="0.01" required />
          </label>
          <button type="submit">Salvar item</button>
        </form>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
